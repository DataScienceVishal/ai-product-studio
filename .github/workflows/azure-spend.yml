# Daily Azure spend report for rg-ai-studio (board task T-2).
# Signs in, asks Cost Management for actual cost, lists the group's resources, and commits the result to
# state/BUDGET.md on main. Every outcome is written to BUDGET.md, including "unavailable" (for example if
# Cost Management doesn't support this subscription's offer), so the studio never mistakes silence for $0.
#
# Credentials, in order of preference (the sign-in step logs which identity was used, never an ID):
#   1. spend: OIDC as the read-only managed identity id-github-spend (Reader + Cost Management Reader on
#      rg-ai-studio; secrets AZURE_SPEND_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID; SETUP.md step 3).
#      When AZURE_SPEND_CLIENT_ID is set, the deploy identity is never used.
#   2. oidc: OIDC as id-github-deploy (secret AZURE_CLIENT_ID). Temporary fallback until the spend identity exists.
#   3. sp: the AZURE_COST_CREDENTIALS secret (a service principal JSON). Temporary; remove after one green run
#      with the spend identity.
# A client id (AZURE_SPEND_CLIENT_ID or AZURE_CLIENT_ID) set without AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID
# fails the run with an error rather than falling through to the next option.
# Both federated credentials trust refs/heads/main only, so the sign-in runs only from main (the schedule always
# does) and the job must not use `environment:`.
# Optional: TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID as Actions secrets for alerts and failure pings.
# Alerts also go to state/DIGEST_NOTES.md, so the next digest carries them even without Telegram.
name: azure-spend

on:
  schedule:
    - cron: "17 6 * * *"  # 06:17 UTC, before the 08:00 UK digest
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-spend
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # commits state/BUDGET.md
      id-token: write # OIDC token for azure/login
    env:
      HAS_SPEND: ${{ secrets.AZURE_SPEND_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
      HAS_SPEND_ID: ${{ secrets.AZURE_SPEND_CLIENT_ID != '' }}
      HAS_OIDC: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
      HAS_DEPLOY_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
      HAS_COST_SP: ${{ secrets.AZURE_COST_CREDENTIALS != '' }}
      HAS_TELEGRAM: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
      ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
      STUDIO_RESOURCE_GROUP: rg-ai-studio
      STUDIO_SPEND_SINCE: "2026-11-01"
      STUDIO_SPEND_CAP: "80"
      # Saved Azure responses live in "$RUNNER_TEMP/spend". (The runner context isn't allowed in job-level env.)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the report script
        run: python3 -m unittest discover -s scripts/tests

      - name: Work out the Azure sign-in
        run: |
          if [ "$HAS_SPEND_ID" = "true" ] && [ "$HAS_SPEND" != "true" ]; then
            echo "::error::AZURE_SPEND_CLIENT_ID is set but AZURE_TENANT_ID or AZURE_SUBSCRIPTION_ID is missing, so the spend identity can't sign in. Add both secrets (SETUP.md step 3)."
            exit 1
          elif [ "$HAS_DEPLOY_ID" = "true" ] && [ "$HAS_OIDC" != "true" ]; then
            echo "::error::AZURE_CLIENT_ID is set but AZURE_TENANT_ID or AZURE_SUBSCRIPTION_ID is missing, so the deploy identity can't sign in. Add both secrets (SETUP.md step 3)."
            exit 1
          elif [ "$HAS_SPEND" = "true" ] && [ "$ON_MAIN" = "true" ]; then mode=spend
          elif [ "$HAS_OIDC" = "true" ] && [ "$ON_MAIN" = "true" ]; then mode=oidc
          elif [ "$HAS_SPEND" = "true" ] || [ "$HAS_OIDC" = "true" ]; then
            echo "::error::The Azure identity's federated credential trusts refs/heads/main only. This run is on $GITHUB_REF. Re-run it from main."
            exit 1
          elif [ "$HAS_COST_SP" = "true" ]; then mode=sp
          else mode=none; fi
          case "$mode" in
            spend) echo "::notice::Signing in as the read-only spend identity (id-github-spend)." ;;
            oidc) echo "::notice::Signing in as the deploy identity (id-github-deploy): temporary, until AZURE_SPEND_CLIENT_ID is set." ;;
            sp) echo "::notice::Signing in with the AZURE_COST_CREDENTIALS service principal: temporary fallback." ;;
          esac
          echo "AZURE_MODE=$mode" >> "$GITHUB_ENV"
          echo "HAS_AZURE=$([ "$mode" = none ] && echo false || echo true)" >> "$GITHUB_ENV"

      - name: Skip without Azure credentials
        if: env.HAS_AZURE != 'true'
        run: echo "::notice::No Azure credentials are set, so no spend report today (SETUP.md step 3)."

      - name: Sign in to Azure (read-only spend identity)
        if: env.AZURE_MODE == 'spend'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_SPEND_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure (deploy identity, temporary fallback)
        if: env.AZURE_MODE == 'oidc'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure (temporary fallback, service principal secret)
        if: env.AZURE_MODE == 'sp'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_COST_CREDENTIALS }}

      - name: Report spend
        id: report
        if: env.HAS_AZURE == 'true'
        run: |
          set -o pipefail
          python3 scripts/azure_spend.py report --save-dir "$RUNNER_TEMP/spend" | tee spend.txt
          summary=$(head -n 1 spend.txt)
          status=$(grep '^STATUS ' spend.txt | awk '{print $2}' || true)
          level=$(grep '^ALERT ' spend.txt | awk '{print $2}' || true)
          changed=$(grep '^CHANGED ' spend.txt | awk '{print $2}' || true)
          echo "### Azure spend: ${summary} (status: ${status})" >> "$GITHUB_STEP_SUMMARY"
          { grep '^UNLISTED ' spend.txt || true; } | while read -r _ name; do
            echo "::warning::${name} is in rg-ai-studio but not in the table in state/BUDGET.md"
          done
          if [ -n "$level" ]; then echo "::warning::Azure spend passed ${level}% of the cap: ${summary}"; fi
          {
            echo "summary=${summary}"
            echo "status=${status}"
            echo "alert=${level}"
            echo "changed=${changed}"
          } >> "$GITHUB_OUTPUT"

      - name: Alert on Telegram
        if: steps.report.outputs.alert != '' && env.HAS_TELEGRAM == 'true'
        continue-on-error: true  # a stale token must never stop BUDGET.md being committed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LEVEL: ${{ steps.report.outputs.alert }}
          SUMMARY: ${{ steps.report.outputs.summary }}
        run: python3 scripts/tg.py send --text "💸 Azure spend passed ${LEVEL}% of the cap. ${SUMMARY}. Details in state/BUDGET.md."

      - name: Commit BUDGET.md to main
        if: ${{ !cancelled() && steps.report.outcome == 'success' && env.ON_MAIN == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Any git failure fails this step (bash -e); only "nothing to commit" is a quiet success.
          stage() {
            git add state/BUDGET.md
            if [ -f state/DIGEST_NOTES.md ]; then git add state/DIGEST_NOTES.md; fi
          }
          stage
          if git diff --cached --quiet; then echo "BUDGET.md unchanged"; exit 0; fi
          git commit -q -m "budget: daily Azure spend report"
          for attempt in 1 2 3 4; do
            if git push -q origin HEAD:main; then exit 0; fi
            # Someone pushed meanwhile: start again from their main and re-render from the saved
            # responses (no new API calls), instead of fighting a rebase conflict.
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 scripts/azure_spend.py report --from-dir "$RUNNER_TEMP/spend" > /dev/null
            stage
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "budget: daily Azure spend report"
            sleep $((attempt * 5))
          done
          echo "::error::could not push BUDGET.md after 4 attempts"
          exit 1

      - name: Fail the run when spend is unknown
        if: steps.report.outputs.status == 'unavailable' || steps.report.outputs.status == 'currency'
        env:
          STATUS: ${{ steps.report.outputs.status }}
          SUMMARY: ${{ steps.report.outputs.summary }}
        run: |
          echo "::error::Spend report status is '${STATUS}': ${SUMMARY}. BUDGET.md records it; see HURDLES.md."
          exit 1

      - name: Tell Vishal the run failed
        # Once per new problem: not every day while Cost Management stays unavailable. Never for a manual run
        # off main: that fails with its own clear message and isn't a failed daily report.
        if: failure() && env.HAS_TELEGRAM == 'true' && env.ON_MAIN == 'true' && (steps.report.outcome != 'success' || steps.report.outputs.changed == 'yes')
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/tg.py send --text "⚠️ The daily Azure spend report failed. Spend may be unknown. ${RUN_URL}"
