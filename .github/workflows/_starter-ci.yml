# CI for the product starter (products/_starter). Products copy this as <slug>-ci.yml.
# Runs on every push that touches the starter (a pull request shows the push's results, so there's no
# separate pull_request trigger to run everything twice). The browser end-to-end test runs on pushes to
# main and on manual runs, to save Actions minutes.
name: _starter-ci

on:
  push:
    paths: ["products/_starter/**", ".github/workflows/_starter-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Digest refreshed by hand (Dependabot does not update workflow service images).
        image: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: starter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studio" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: products/_starter/backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://studio:studio@localhost:5432/starter_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: products/_starter/backend/requirements-dev.txt
      - name: Install pinned, hash-checked dependencies
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql+psycopg://studio:studio@localhost:5432/starter_test
        run: alembic upgrade head && alembic check && alembic downgrade base
      - name: db-setup.sql against Postgres 16 with a stub Entra provider (ADR 0003 slice 3)
        env:
          REQUIRE_PG: "1"
          PGHOST: localhost
          PGUSER: studio
          PGPASSWORD: studio
        run: bash ../infra/test-db-setup.sh
      - run: python -m pytest -q
      - name: Known vulnerabilities in the runtime dependencies
        run: pipx run pip-audit==2.10.1 --require-hashes -r requirements.txt

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the production image (frontend build and backend, one image)
        run: docker build -t starter:ci -f products/_starter/Dockerfile products/_starter
      - name: The image serves the app and the API
        run: |
          docker run -d --name starter-ci -p 8000:8000 -e ENV=dev -e COOKIE_SECURE=false \
            -e DATABASE_URL=postgresql+psycopg://x:x@127.0.0.1:1/x starter:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/livez >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/livez
          curl -fsS -D - -o /dev/null http://127.0.0.1:8000/verify-email | grep -i "content-security-policy: default-src 'self'"
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/nope)" = 404
          docker rm -f starter-ci
      - name: Container logs (on failure)
        if: failure()
        run: docker logs starter-ci || true

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: products/_starter/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: products/_starter/frontend/package-lock.json
      - run: npm ci
      - name: Unit tests (vitest, jsdom, fetch mocked)
        run: npm test
      - run: npm run build
      - name: Known vulnerabilities in shipped dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Digest refreshed by hand (Dependabot does not update workflow service images).
        image: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studio" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: products/_starter/backend/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            products/_starter/frontend/package-lock.json
            products/_starter/tests/e2e/package-lock.json
      - run: pip install --require-hashes -r products/_starter/backend/requirements-dev.txt
      - run: npm ci && npx vite build
        working-directory: products/_starter/frontend
      - name: Install the pinned Playwright
        run: npm ci
        working-directory: products/_starter/tests/e2e
      - name: Cache Playwright's browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('products/_starter/tests/e2e/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: products/_starter/tests/e2e
      - name: Run the core-flow test
        env:
          PYTHON: python
          E2E_DATABASE_URL: postgresql+psycopg://studio:studio@localhost:5432/starter_e2e
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          E2E_LOG_DIR="$RUNNER_TEMP/e2e" products/_starter/scripts/e2e.sh
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e
          retention-days: 7

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BICEP_VERSION: v0.32.4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the pinned Bicep CLI (compile only, no Azure login)
        run: az bicep install --version "$BICEP_VERSION"
      - name: Compile the templates and parameter files
        working-directory: products/_starter/infra
        run: |
          out="$RUNNER_TEMP/bicep"
          mkdir -p "$out"
          az bicep version
          az bicep build --file shared.bicep --outdir "$out"
          az bicep build --file main.bicep --outdir "$out"
          az bicep build-params --file shared.bicepparam --outfile "$out/shared.parameters.json"
          az bicep build-params --file main.bicepparam --outfile "$out/main.parameters.json"
      - name: Identity and Entra assertions on the compiled templates (ADR 0003 slices 1 and 2)
        run: bash products/_starter/infra/test-bicep-identities.sh "$RUNNER_TEMP/bicep/shared.json" "$RUNNER_TEMP/bicep/main.json"
      - name: Cost guard on the compiled templates
        run: bash products/_starter/infra/cost-guard.sh "$RUNNER_TEMP/bicep/shared.json" "$RUNNER_TEMP/bicep/main.json"
      - name: Script syntax
        working-directory: products/_starter/infra
        run: |
          for f in *.sh; do bash -n "$f"; done
      - name: Deploy workflow checks (ADR 0003 slice 4)
        run: bash products/_starter/infra/test-deploy-workflow.sh
