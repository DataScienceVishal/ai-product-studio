# CI for the product starter (products/_starter). Products copy this as <slug>-ci.yml.
# Unit and API tests plus the frontend build run on every push and PR that touches the starter.
# The browser end-to-end test runs on pushes to main and on manual runs, to save Actions minutes.
name: _starter-ci

on:
  push:
    paths: ["products/_starter/**", ".github/workflows/_starter-ci.yml"]
  pull_request:
    paths: ["products/_starter/**", ".github/workflows/_starter-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: starter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studio" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: products/_starter/backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://studio:studio@localhost:5432/starter_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: products/_starter/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql+psycopg://studio:studio@localhost:5432/starter_test
        run: alembic upgrade head && alembic check && alembic downgrade base
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: products/_starter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: products/_starter/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studio" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: products/_starter/backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: products/_starter/frontend/package-lock.json
      - run: pip install -r products/_starter/backend/requirements-dev.txt
      - run: npm ci && npx vite build
        working-directory: products/_starter/frontend
      - name: Install Playwright's Chromium
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
        working-directory: products/_starter/tests/e2e
      - name: Run the core-flow test
        env:
          PYTHON: python
          NODE_PATH: ${{ github.workspace }}/products/_starter/tests/e2e/node_modules
          E2E_DATABASE_URL: postgresql+psycopg://studio:studio@localhost:5432/starter_e2e
          E2E_LOG_DIR: ${{ runner.temp }}/e2e
        run: mkdir -p "$E2E_LOG_DIR" && products/_starter/scripts/e2e.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e
          retention-days: 7
