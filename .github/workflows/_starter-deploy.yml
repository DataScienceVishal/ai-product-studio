# Deploy the product starter to Azure Container Apps (board task T-7; design in
# products/_starter/ADR/0002-azure-deploy.md, runbook in products/_starter/infra/README.md).
# Products copy this as <slug>-deploy.yml and change the env block below.
#
# Manual only, for now. Every run compiles the Bicep and checks the compiled templates for features with a
# fixed charge. It deploys only when all three hold; otherwise it stops with a notice:
#   - the AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID secrets exist (AZURE_CLIENT_ID set while
#     either of the other two is missing fails the run instead of stopping with a notice). They name the user-assigned
#     managed identity id-github-deploy (Contributor on rg-ai-studio only), which GitHub signs in as through
#     OIDC: no stored password. Its federated credential trusts only
#     repo:DataScienceVishal@102427114/ai-product-studio@1468636475:ref:refs/heads/main, so Azure sign-in works only from main. Don't
#     add `environment:` to a job that signs in: the token's subject would change and the login would fail
#     (ADR 0002, decision 8);
#   - Vishal has approved the costs in state/BUDGET.md by setting the repository variable
#     STUDIO_AZURE_APPROVED to "yes";
#   - the run is on main, so only reviewed code reaches the public address. (Azure also refuses a token to any
#     run not on main, through the federated credential's subject; ADR 0002, decision 8.)
#
# OIDC note: GitHub's ID token lasts about 5 minutes and the CLI replays it for every token of a NEW resource
# (azure/login issue 372, error AADSTS700024). So the deploy job signs in again right before the first use of
# the registry and of Postgres, after the long steps. Keep a fresh sign-in before any new long-delayed resource.
#
# Release order: build, then scan (both before any Azure sign-in); read the live release, failing closed on
# any Azure error; push by digest; deploy a new revision with no traffic (the purge and cancels jobs stay on the live
# revision); migrate as a separate job; smoke-test the new revision; move all traffic to it; smoke-test the
# public address; only then move the purge and cancels jobs to the new image. Any failure after traffic moved sends
# traffic and both jobs back to the previous revision.
name: _starter-deploy

on:
  workflow_dispatch:
    inputs:
      ai_provider:
        description: "AI provider. azure uses the AZURE_OPENAI_* secrets and spends tokens (capped per day)."
        type: choice
        options: [fake, azure]
        default: fake
      billing_provider:
        description: "Billing provider. stripe (test mode) needs the STARTER_* Stripe secrets."
        type: choice
        options: [mock, stripe]
        default: mock
      require_email_verification:
        description: "Require a verified email for AI, checkout and invitations. Leave off while email is outbox-only: nobody can verify (ADR 0002)."
        type: boolean
        default: false
      mock_checkout:
        description: "Show the demo 'Pay (test)' button (mock billing only; it grants a paid plan for free)."
        type: boolean
        default: false
      deploy_shared:
        description: "Also create or update the shared studio resources (registry, environment, logs, Postgres). Starter only."
        type: boolean
        default: false
      rollback_to:
        description: "Don't deploy: move all traffic, and the purge job, back to this earlier revision (name from a run summary)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # never stop a release halfway

defaults:
  run:
    shell: bash

env:
  PRODUCT: starter # Azure-safe slug: ca-starter, caj-starter-migrate, caj-starter-purge, caj-starter-cancels
  PRODUCT_DIR: products/_starter
  DB_NAME: starter # this product's database; its roles are starter_migrator and starter_app
  RESOURCE_GROUP: rg-ai-studio
  # Shared resources: keep in step with infra/shared.bicepparam and main.bicep's defaults.
  REGISTRY: acrstudioznp96r
  PG_SERVER: psql-studio-znp96r
  ENVIRONMENT: cae-studio
  PULL_IDENTITY: id-studio-acrpull
  # One image holds the built frontend and the backend that serves it (T-16); the smoke test also checks
  # the HTML and its CSP.
  IMAGE_CONTEXT: products/_starter
  DOCKERFILE: products/_starter/Dockerfile
  EXPECT_SPA: "true"
  # Trivy 0.76.2 (2026-11-05), pinned by digest.
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  # Saved Azure outputs go in "$RUNNER_TEMP" (GitHub rejects the runner context in workflow and job env).

jobs:
  check:
    name: Check templates, credentials and approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bicep compiles, scripts parse (no Azure sign-in needed)
        working-directory: ${{ env.PRODUCT_DIR }}/infra
        run: |
          az bicep install --only-show-errors
          az bicep build --file shared.bicep --outfile "$RUNNER_TEMP/shared.json"
          az bicep build --file main.bicep --outfile "$RUNNER_TEMP/main.json"
          az bicep build-params --file shared.bicepparam --outfile "$RUNNER_TEMP/shared.parameters.json"
          az bicep build-params --file main.bicepparam --outfile "$RUNNER_TEMP/main.parameters.json"
          for script in *.sh; do bash -n "$script"; done

      - name: No features with a fixed charge, and an AI cap the real model can afford
        env:
          # The same values the deploy job uses, so the AI cost rule (backend/app/aicost.py) sees the model that is
          # actually deployed. cost-guard.sh never prints them.
          AI_PROVIDER: ${{ inputs.ai_provider }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT || 'gpt-5-mini' }}
          AI_PRICE_PER_MILLION_TOKENS: ${{ vars.AI_PRICE_PER_MILLION_TOKENS }}
        run: |
          # The compiled templates are what Azure gets, so values from parameters and modules count too.
          bash "$PRODUCT_DIR/infra/cost-guard.sh" "$RUNNER_TEMP/shared.json" "$RUNNER_TEMP/main.json"
          # The same words in the source, as a second net (Bicep files only, so docs can mention them).
          if grep -rnE --include='*.bicep' "maintenanceConfigurations|privateEndpoint|vnetConfiguration|infrastructureSubnetId|workloadProfileType: *'[^C]" "$PRODUCT_DIR/infra"; then
            echo "::error::infra mentions a feature with a fixed charge: a maintenance window, a private endpoint, a custom network or a non-Consumption workload profile (ADR 0002, decision 1)."
            exit 1
          fi

      - name: Credentials, approval and branch
        id: gate
        env:
          HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
          HAS_DEPLOY_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          APPROVED: ${{ vars.STUDIO_AZURE_APPROVED }}
        run: |
          go=false
          # A client id without tenant or subscription is a broken setup, not a fresh one: fail loudly, as
          # azure-spend.yml does. Tenant and subscription alone are fine (the spend identity uses them too).
          if [ "$HAS_DEPLOY_ID" = "true" ] && [ "$HAS_AZURE" != "true" ]; then
            echo "::error::AZURE_CLIENT_ID is set but AZURE_TENANT_ID or AZURE_SUBSCRIPTION_ID is missing, so the deploy identity can't sign in. Add both secrets (SETUP.md step 3)."
            exit 1
          elif [ "$HAS_AZURE" != "true" ]; then
            echo "::notice::The AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID secrets aren't all set, so nothing was deployed. The Bicep compiled. See $PRODUCT_DIR/infra/README.md."
          elif [ "$APPROVED" != "yes" ]; then
            echo "::notice::Nothing was deployed: the costs in state/BUDGET.md need Vishal's approval first. He approves by setting the repository variable STUDIO_AZURE_APPROVED to yes."
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::notice::Nothing was deployed: deploys run from main only, so only reviewed code is published. This run was on $GITHUB_REF."
          else
            go=true
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build, migrate and release
    needs: check
    if: needs.check.outputs.go == 'true' && inputs.rollback_to == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # OIDC token for azure/login
    env:
      AI_PROVIDER: ${{ inputs.ai_provider }}
      BILLING_PROVIDER: ${{ inputs.billing_provider }}
      REQUIRE_EMAIL_VERIFICATION: ${{ inputs.require_email_verification && 'true' || 'false' }}
      MOCK_CHECKOUT_ENABLED: ${{ inputs.mock_checkout && 'true' || 'false' }}
      # The only provider today. A real one needs approval, and then require_email_verification must be on:
      # the app refuses to start otherwise.
      EMAIL_PROVIDER: outbox
      # Optional repository variable: explicit USD per million tokens for a deployment missing from the price table.
      AI_PRICE_PER_MILLION_TOKENS: ${{ vars.AI_PRICE_PER_MILLION_TOKENS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: |
          tag="${GITHUB_SHA::12}-r${GITHUB_RUN_NUMBER}a${GITHUB_RUN_ATTEMPT}"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          docker build --pull --tag "local/$PRODUCT:$tag" --file "$DOCKERFILE" "$IMAGE_CONTEXT"

      - name: Scan the image (fixable HIGH and CRITICAL vulnerabilities fail the release)
        # Before the Azure sign-in, and from a saved tarball instead of the Docker socket, so the scanner
        # never sees credentials. A justified exception goes in <product folder>/.trivyignore.
        run: |
          mkdir -p "$RUNNER_TEMP/scan"
          docker save "local/$PRODUCT:$IMAGE_TAG" --output "$RUNNER_TEMP/scan/image.tar"
          ignore=()
          if [ -f "$PRODUCT_DIR/.trivyignore" ]; then
            cp "$PRODUCT_DIR/.trivyignore" "$RUNNER_TEMP/scan/.trivyignore"
            ignore=(--ignorefile /scan/.trivyignore)
          fi
          docker run --rm --volume "$RUNNER_TEMP/scan:/scan" "$TRIVY_IMAGE" image \
            --input /scan/image.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress "${ignore[@]}"
          rm -f "$RUNNER_TEMP/scan/image.tar"

      - name: Only from main (the Azure sign-in trusts main only)
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This job signs in to Azure, and the identity's federated credential trusts refs/heads/main only. This run is on $GITHUB_REF. Re-run it from main."
            exit 1
          fi

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Shared studio resources (only when asked)
        if: inputs.deploy_shared
        working-directory: ${{ env.PRODUCT_DIR }}/infra
        run: |
          az bicep install --only-show-errors
          # The server admin password (ADR 0003) is random per run and exists only because Azure requires one at server creation; password sign-in is disabled. Made and used only in this
          # step: masked before first use, never written to GITHUB_ENV, GITHUB_OUTPUT, a file or an argument.
          # shared.bicepparam reads it from this step's environment. Nobody needs it: sign-in is Entra.
          PG_ADMIN_PASSWORD="$(openssl rand -base64 32 | tr -d '\n')Aa1!"
          echo "::add-mask::$PG_ADMIN_PASSWORD"
          export PG_ADMIN_PASSWORD
          az deployment group create --resource-group "$RESOURCE_GROUP" --name studio-shared \
            --parameters shared.bicepparam --only-show-errors --output none
          echo "Shared resources are in place."

      - name: Shared resources exist and the app can pull images
        run: |
          if ! az acr show --name "$REGISTRY" --output none 2>/dev/null \
            || ! az containerapp env show --resource-group "$RESOURCE_GROUP" --name "$ENVIRONMENT" --output none 2>/dev/null \
            || ! az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$PG_SERVER" --output none 2>/dev/null; then
            echo "::error::The shared resources aren't there yet. Run this workflow once with deploy_shared ticked (after Vishal's approval)."
            exit 1
          fi
          principal=$(az identity show --resource-group "$RESOURCE_GROUP" --name "$PULL_IDENTITY" --query principalId --output tsv)
          registry_id=$(az acr show --name "$REGISTRY" --query id --output tsv)
          granted=$(az role assignment list --scope "$registry_id" --include-inherited \
            --query "length([?principalId=='$principal' && ends_with(roleDefinitionId, '7f951dda-4ed3-4680-a7ca-43fe172d538d')])" \
            --output tsv)
          if [ "$granted" = "0" ]; then
            echo "::error::$PULL_IDENTITY can't pull images yet. Vishal runs this once in Azure Cloud Shell ($PRODUCT_DIR/infra/README.md, setup step 5):"
            echo "az role assignment create --assignee-object-id $principal --assignee-principal-type ServicePrincipal --role AcrPull --scope $registry_id"
            exit 1
          fi

      - name: Database sign-in is Entra only (every release; fails if password sign-in is on)
        run: bash "$PRODUCT_DIR/infra/check-auth-config.sh"

      - name: Read the live release (stops on any Azure read error)
        run: bash "$PRODUCT_DIR/infra/live-release.sh" >> "$GITHUB_ENV"

      - name: Only from main (the Azure sign-in trusts main only)
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This job signs in to Azure, and the identity's federated credential trusts refs/heads/main only. This run is on $GITHUB_REF. Re-run it from main."
            exit 1
          fi

      - name: Sign in to Azure again (fresh GitHub token for the registry; the first one is minutes old)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push the image
        run: |
          az acr login --name "$REGISTRY" --only-show-errors
          remote="$REGISTRY.azurecr.io/$PRODUCT:$IMAGE_TAG"
          docker tag "local/$PRODUCT:$IMAGE_TAG" "$remote"
          docker push --quiet "$remote"
          image=$(docker inspect --format '{{index .RepoDigests 0}}' "$remote")
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "Pushed $image"

      - name: Deploy the app and jobs (the new revision gets no traffic; the purge and cancels jobs stay on the live one)
        working-directory: ${{ env.PRODUCT_DIR }}/infra
        env:
          # Passed whenever they exist, whichever provider this release uses, so a provider switch never
          # removes a secret that the previous revision still reads. Only the chosen provider is wired in.
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT || 'gpt-5-mini' }}
          BILLING_WEBHOOK_SECRET: ${{ secrets.STARTER_BILLING_WEBHOOK_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STARTER_STRIPE_SECRET_KEY }}
        run: |
          if [ "$AI_PROVIDER" = "azure" ] && { [ -z "$AZURE_OPENAI_ENDPOINT" ] || [ -z "$AZURE_OPENAI_API_KEY" ]; }; then
            echo "::error::ai_provider=azure needs the AZURE_OPENAI_ENDPOINT and AZURE_OPENAI_API_KEY secrets (SETUP.md step 3)."
            exit 1
          fi
          if [ "$BILLING_PROVIDER" = "stripe" ] && { [ -z "$BILLING_WEBHOOK_SECRET" ] || [ -z "$STRIPE_SECRET_KEY" ]; }; then
            echo "::error::billing_provider=stripe needs the STARTER_BILLING_WEBHOOK_SECRET and STARTER_STRIPE_SECRET_KEY secrets."
            exit 1
          fi
          if [ "$FIRST_RELEASE" != "true" ] && [ -z "$LIVE_REVISION" ]; then
            echo "::error::No live revision was read, so the release stops." # live-release.sh should have stopped already
            exit 1
          fi
          host="$PG_SERVER.postgres.database.azure.com"
          tls="sslmode=verify-full&sslrootcert=/etc/ssl/certs/ca-certificates.crt"
          export REVISION_SUFFIX="r${GITHUB_RUN_NUMBER}a${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"
          # No password in either URL: the user is the role, and DB_AUTH=entra makes each container sign in with a
          # token from its own identity (ADR 0003). The host comes only from PG_SERVER (security B2).
          export DB_AUTH=entra
          export DATABASE_URL_APP="postgresql+psycopg://${DB_NAME}_app@${host}:5432/${DB_NAME}?${tls}"
          export DATABASE_URL_MIGRATE="postgresql+psycopg://${DB_NAME}_migrator@${host}:5432/${DB_NAME}?${tls}"
          az bicep install --only-show-errors
          # LIVE_REVISION and PURGE_* come from live-release.sh; on a first release they are empty, so the
          # only revision takes the traffic and the purge job gets this release's image.
          az deployment group create --resource-group "$RESOURCE_GROUP" \
            --name "$PRODUCT-r$GITHUB_RUN_NUMBER-a$GITHUB_RUN_ATTEMPT" --parameters main.bicepparam \
            --query properties.outputs --output json --only-show-errors > "$RUNNER_TEMP/outputs.json"
          {
            echo "CANDIDATE=$(jq -r .candidateRevision.value "$RUNNER_TEMP/outputs.json")"
            echo "APP_FQDN=$(jq -r .appFqdn.value "$RUNNER_TEMP/outputs.json")"
            echo "APP_OID=$(jq -r .appIdentityPrincipalId.value "$RUNNER_TEMP/outputs.json")"
            echo "MIGRATOR_OID=$(jq -r .migrateIdentityPrincipalId.value "$RUNNER_TEMP/outputs.json")"
          } >> "$GITHUB_ENV"

      - name: Only from main (the Azure sign-in trusts main only)
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This job signs in to Azure, and the identity's federated credential trusts refs/heads/main only. This run is on $GITHUB_REF. Re-run it from main."
            exit 1
          fi

      - name: Sign in to Azure again (the OIDC assertion lasts about 5 minutes and the database token is a new resource)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Product database and roles (every release; idempotent, no secret)
        id: dbsetup
        # Runs as the server's Entra admin (the deploy identity id-github-deploy) with a token as the password
        # (ADR 0003, decision 4). Needs the object ids that the deploy step above just read from main.bicep.
        run: |
          command -v psql > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          major=$(psql --version | grep -oE '[0-9]+' | head -1)
          if [ "${major:-0}" -lt 16 ]; then
            echo "::error::psql ${major:-unknown} is too old: db-setup.sql needs psql 16 or later."
            exit 1
          fi
          uuid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          app_oid=${APP_OID,,}
          migrator_oid=${MIGRATOR_OID,,}
          if ! [[ "$app_oid" =~ $uuid ]] || ! [[ "$migrator_oid" =~ $uuid ]]; then
            echo "::error::main.bicep's identity object ids are missing or not UUIDs. Is the deploy step's output complete?"
            exit 1
          fi
          # Who are we? The token's oid is the deploy principal; the server must list exactly that one admin.
          token=$(az account get-access-token --resource-type oss-rdbms --query accessToken --output tsv)
          if [ -z "$token" ]; then
            echo "::error::az returned no database token."
            exit 1
          fi
          echo "::add-mask::$token" # after the empty check: an empty mask does nothing
          me=$(printf '%s' "$token" | bash "$PRODUCT_DIR/infra/jwt-oid.sh")
          unset token
          if ! [[ "$me" =~ $uuid ]]; then
            echo "::error::Couldn't read the deploy principal's object id from its token."
            exit 1
          fi
          server_id=$(az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$PG_SERVER" --query id --output tsv)
          admins=$(az rest --method get --url "https://management.azure.com${server_id}/administrators?api-version=2024-08-01" --output json)
          other=$(jq -r --arg me "$me" '[.value[] | select((.name | ascii_downcase) != $me) | .name] | join(",")' <<< "$admins")
          if [ -n "$other" ]; then
            echo "::error::$PG_SERVER has Entra admins besides the deploy principal ($other). Incremental Bicep never removes one: remove it through ARM (infra/README.md), then release again."
            exit 1
          fi
          admin=$(jq -r --arg me "$me" '[.value[] | select((.name | ascii_downcase) == $me) | .properties.principalName][0] // empty' <<< "$admins")
          if [ -z "$admin" ]; then
            echo "::error::The deploy principal is not an Entra admin of $PG_SERVER. Run this workflow once with deploy_shared ticked."
            exit 1
          fi
          if ! [[ "$admin" =~ ^[A-Za-z0-9_.@-]{1,63}$ ]]; then
            echo "::error::The Entra admin name of $PG_SERVER has characters this workflow doesn't allow (letters, digits and _ . @ - only, at most 63). Set postgresEntraAdminName to the deploy identity's name (id-github-deploy) and run with deploy_shared ticked."
            exit 1
          fi
          ip=$(curl -fsS --max-time 10 https://api.ipify.org || true)
          if ! [[ "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "::error::Couldn't read this runner's public IPv4 address."
            exit 1
          fi
          # A firewall rule for this runner only, removed again by the always-run step below.
          az postgres flexible-server firewall-rule create --resource-group "$RESOURCE_GROUP" --server-name "$PG_SERVER" \
            --name "gh-run-$GITHUB_RUN_ID" --start-ip-address "$ip" --end-ip-address "$ip" --only-show-errors --output none
          # The host comes only from PG_SERVER, so a token can't be sent to another server (security B2).
          export PGHOST="$PG_SERVER.postgres.database.azure.com" PGSSLMODE=verify-full \
            PGSSLROOTCERT=/etc/ssl/certs/ca-certificates.crt PGCONNECT_TIMEOUT=10
          exec 3>&1 # the mask lines below must reach the runner even when a call redirects stdout
          run_psql() { # a fresh token each time (5 to 60 minutes of life); it goes only through PGPASSWORD
            local t
            t=$(az account get-access-token --resource-type oss-rdbms --query accessToken --output tsv)
            if [ -z "$t" ]; then echo "az returned no database token" >&2; return 1; fi
            echo "::add-mask::$t" >&3
            PGPASSWORD="$t" psql -X -w -U "$admin" -d postgres "$@"
          }
          for attempt in $(seq 1 36); do # firewall changes can take up to five minutes
            if run_psql -tAc 'select 1' > /dev/null 2> "$RUNNER_TEMP/psql.err"; then
              break
            fi
            if grep -qiE "certificate|ssl error" "$RUNNER_TEMP/psql.err"; then
              echo "::error::The TLS check failed for $PGHOST: $(head -c 300 "$RUNNER_TEMP/psql.err")"
              exit 1
            fi
            if grep -qiE "authentication failed|role .* does not exist" "$RUNNER_TEMP/psql.err"; then
              echo "::error::$PGHOST refused the deploy principal's token as $admin: $(head -c 300 "$RUNNER_TEMP/psql.err"). Run this workflow with deploy_shared ticked."
              exit 1
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "::error::Couldn't reach $PGHOST after 6 minutes: $(head -c 300 "$RUNNER_TEMP/psql.err")"
              exit 1
            fi
            sleep 10
          done
          # db-grants.sql sits beside db-setup.sql: setup runs it as the migrator (\ir after SET ROLE).
          run_psql -v ON_ERROR_STOP=1 \
            -v db="$DB_NAME" -v migrator="${DB_NAME}_migrator" -v app="${DB_NAME}_app" \
            -v app_oid="$app_oid" -v migrator_oid="$migrator_oid" \
            -f "$PRODUCT_DIR/infra/db-setup.sql"
          echo "Database $DB_NAME with roles ${DB_NAME}_migrator and ${DB_NAME}_app is ready."

      - name: Remove the runner's database firewall rule
        # Not when the run stopped before the database step (for example a Trivy failure before Azure sign-in).
        if: always() && steps.dbsetup.outcome != 'skipped'
        run: |
          if ! az postgres flexible-server firewall-rule delete --resource-group "$RESOURCE_GROUP" --server-name "$PG_SERVER" \
            --name "gh-run-$GITHUB_RUN_ID" --yes --only-show-errors --output none 2> "$RUNNER_TEMP/firewall.err"; then
            if ! grep -qiE "not found|ResourceNotFound" "$RUNNER_TEMP/firewall.err"; then
              echo "::warning::Couldn't remove the firewall rule gh-run-$GITHUB_RUN_ID from $PG_SERVER ($(head -c 200 "$RUNNER_TEMP/firewall.err")). Remove it by hand: az postgres flexible-server firewall-rule delete --resource-group $RESOURCE_GROUP --server-name $PG_SERVER --name gh-run-$GITHUB_RUN_ID --yes"
            fi
          fi

      - name: Migrate the database (a separate job, before any traffic moves)
        run: |
          job="caj-$PRODUCT-migrate"
          execution=$(az containerapp job start --resource-group "$RESOURCE_GROUP" --name "$job" \
            --query name --output tsv --only-show-errors)
          echo "Started $execution"
          for _ in $(seq 1 60); do
            status=$(az containerapp job execution show --resource-group "$RESOURCE_GROUP" --name "$job" \
              --job-execution-name "$execution" --query properties.status --output tsv --only-show-errors)
            case "$status" in
              Succeeded) echo "Migrations applied."; exit 0 ;;
              Failed|Stopped|Degraded)
                echo "::error::Migration $execution ended '$status'. Alembic runs all pending migrations in one transaction, so the schema is unchanged. Its output is in log-studio (ContainerAppConsoleLogs for $job)."
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Migration $execution was still running after 10 minutes."
          exit 1

      - name: Smoke-test the new revision before it gets traffic
        id: candidate
        run: |
          fqdn=$(az containerapp revision show --resource-group "$RESOURCE_GROUP" --name "ca-$PRODUCT" \
            --revision "$CANDIDATE" --query properties.fqdn --output tsv)
          bash "$PRODUCT_DIR/infra/smoke.sh" "https://$fqdn"

      - name: Move all traffic to the new revision
        id: shift
        if: env.LIVE_REVISION != '' && env.LIVE_REVISION != env.CANDIDATE
        run: |
          az containerapp ingress traffic set --resource-group "$RESOURCE_GROUP" --name "ca-$PRODUCT" \
            --revision-weight "$CANDIDATE=100" "$LIVE_REVISION=0" --only-show-errors --output none

      - name: Smoke-test the public address
        id: public
        run: bash "$PRODUCT_DIR/infra/smoke.sh" "https://$APP_FQDN"

      - name: Point the purge and cancels jobs at the new release (only now that it has passed)
        id: promote
        run: bash "$PRODUCT_DIR/infra/purge-job.sh" follow "$CANDIDATE"

      - name: Roll back traffic and the jobs to the previous revision
        # Also when someone cancels the run halfway.
        if: (failure() || cancelled()) && steps.shift.outcome != 'skipped' && env.LIVE_REVISION != '' && env.CANDIDATE != ''
        run: |
          az containerapp ingress traffic set --resource-group "$RESOURCE_GROUP" --name "ca-$PRODUCT" \
            --revision-weight "$LIVE_REVISION=100" "$CANDIDATE=0" --only-show-errors --output none
          if ! bash "$PRODUCT_DIR/infra/purge-job.sh" follow "$LIVE_REVISION"; then
            echo "::error::The purge and cancels jobs couldn't be pointed back at $LIVE_REVISION. Run this workflow with rollback_to=$LIVE_REVISION."
          fi
          az containerapp revision deactivate --resource-group "$RESOURCE_GROUP" --name "ca-$PRODUCT" \
            --revision "$CANDIDATE" --only-show-errors --output none || true
          echo "::error::$CANDIDATE failed after traffic moved, so all traffic, and the purge job, are back on $LIVE_REVISION. The database keeps this release's migrations (ADR 0002, decision 9)."

      - name: Retire a new revision that never got traffic
        if: (failure() || cancelled()) && steps.shift.outcome == 'skipped' && env.LIVE_REVISION != '' && env.CANDIDATE != ''
        run: |
          az containerapp revision deactivate --resource-group "$RESOURCE_GROUP" --name "ca-$PRODUCT" \
            --revision "$CANDIDATE" --only-show-errors --output none || true
          echo "::error::The release stopped before traffic moved. $LIVE_REVISION still serves everyone, and the purge job still runs its image."

      - name: Retire revisions older than the previous one
        # The previous revision stays active with 0% traffic, at no cost while it has no replicas, so a
        # rollback is instant. Anything older is deactivated: it can be re-activated with rollback_to.
        # A failure here doesn't undo a release that passed.
        continue-on-error: true
        run: |
          for rev in $(az containerapp revision list --resource-group "$RESOURCE_GROUP" --name "ca-$PRODUCT" \
              --query "[?properties.active].name" --output tsv); do
            if [ "$rev" != "$CANDIDATE" ] && [ "$rev" != "$LIVE_REVISION" ]; then
              az containerapp revision deactivate --resource-group "$RESOURCE_GROUP" --name "ca-$PRODUCT" \
                --revision "$rev" --only-show-errors --output none
              echo "Deactivated $rev"
            fi
          done

      - name: Summary
        if: always()
        env:
          PROMOTED: ${{ steps.promote.outcome }}
        run: |
          {
            echo "### Deploy of $PRODUCT"
            echo "- Address: https://${APP_FQDN:-not deployed}"
            echo "- New revision: ${CANDIDATE:-none} (image ${IMAGE:-not pushed})"
            echo "- Previous revision, still active for a quick rollback: ${LIVE_REVISION:-none (first release)}"
            echo "- Purge and cancels jobs moved to the new image: ${PROMOTED:-not reached}"
            echo "- AI: $AI_PROVIDER; billing: $BILLING_PROVIDER; email verification: $REQUIRE_EMAIL_VERIFICATION; mock checkout: $MOCK_CHECKOUT_ENABLED"
          } >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: Roll back to an earlier revision
    needs: check
    if: needs.check.outputs.go == 'true' && inputs.rollback_to != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC token for azure/login
    env:
      TARGET: ${{ inputs.rollback_to }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the revision name
        run: |
          if ! [[ "$TARGET" =~ ^ca-${PRODUCT}--[a-z][a-z0-9-]{0,40}[a-z0-9]$ ]]; then
            echo "::error::rollback_to must be a revision of ca-$PRODUCT, such as ca-$PRODUCT--r12a1-1a2b3c4."
            exit 1
          fi

      - name: Only from main (the Azure sign-in trusts main only)
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This job signs in to Azure, and the identity's federated credential trusts refs/heads/main only. This run is on $GITHUB_REF. Re-run it from main."
            exit 1
          fi

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Activate the revision and smoke-test it
        run: |
          # The previous revision is usually still active; activating it again is harmless. A revision that
          # doesn't exist fails at "revision show" below.
          az containerapp revision activate --resource-group "$RESOURCE_GROUP" --name "ca-$PRODUCT" \
            --revision "$TARGET" --only-show-errors --output none || true
          fqdn=$(az containerapp revision show --resource-group "$RESOURCE_GROUP" --name "ca-$PRODUCT" \
            --revision "$TARGET" --query properties.fqdn --output tsv)
          bash "$PRODUCT_DIR/infra/smoke.sh" "https://$fqdn"

      - name: Move all traffic to it
        run: |
          current=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "ca-$PRODUCT" \
            --query "properties.configuration.ingress.traffic[?weight==\`100\`] | [0].revisionName" --output tsv)
          echo "PREVIOUS=$current" >> "$GITHUB_ENV"
          weights=("$TARGET=100")
          if [ -n "$current" ] && [ "$current" != "$TARGET" ]; then weights+=("$current=0"); fi
          az containerapp ingress traffic set --resource-group "$RESOURCE_GROUP" --name "ca-$PRODUCT" \
            --revision-weight "${weights[@]}" --only-show-errors --output none
          fqdn=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "ca-$PRODUCT" \
            --query properties.configuration.ingress.fqdn --output tsv)
          bash "$PRODUCT_DIR/infra/smoke.sh" "https://$fqdn"

      - name: Point the purge and cancels jobs at the same revision
        run: bash "$PRODUCT_DIR/infra/purge-job.sh" follow "$TARGET"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Rollback of $PRODUCT to $TARGET"
            echo "- Traffic was on: ${PREVIOUS:-unknown}. Check the steps above for the result."
            echo "- The purge and cancels jobs follow the revision that serves traffic (purge-job.sh)."
            echo "- The database schema is NOT rolled back. It stays on the newest migration, which the older code"
            echo "  must still work with (ADR 0002, decision 9: expand first, contract in a later release)."
          } >> "$GITHUB_STEP_SUMMARY"
