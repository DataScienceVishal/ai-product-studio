# Refresh job for supply-chain pins (T-19). Dependabot opens pull requests; a human or reviewer merges them.
# Docker PRs run _starter-ci (image build and smoke test). Action bumps outside the starter's workflow
# file get no automatic CI, so check them by hand before merging.
version: 2
updates:
  - package-ecosystem: docker
    directory: /products/_starter
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
