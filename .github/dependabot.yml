# Refresh job for supply-chain pins (T-19). Dependabot opens pull requests; nothing merges without review and green CI.
version: 2
updates:
  - package-ecosystem: docker
    directory: /products/_starter
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
